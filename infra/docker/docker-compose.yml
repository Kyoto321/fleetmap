# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  fleet-internal:
    driver: bridge
  fleet-monitoring:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  kafka_data:
  zookeeper_data:
  grafana_data:

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL + TimescaleDB ────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       fleetdb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-rls.sql:/docker-entrypoint-initdb.d/01-rls.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "fleetdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [fleet-internal]
    ports: ["5432:5432"]

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_password}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [fleet-internal]
    ports: ["6379:6379"]

  # ── Zookeeper (Kafka dependency) ─────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper
    networks: [fleet-internal]

  # ── Apache Kafka ─────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID:                     1
      KAFKA_ZOOKEEPER_CONNECT:             zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:          PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME:    PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:     'false'
      KAFKA_LOG_RETENTION_HOURS:           168
      KAFKA_LOG_SEGMENT_BYTES:             1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_NUM_PARTITIONS:                10
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [fleet-internal]
    ports: ["29092:29092"]

  # ── Kafka Topic Initializer ────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry.raw   --partitions 10 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic telemetry.dead  --partitions 3  --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic jobs.events     --partitions 6  --replication-factor 1
        echo "Topics created successfully"
    networks: [fleet-internal]

  # ── Core Monolith (FastAPI) ───────────────────────────────────────────────
  monolith:
    build:
      context: ../../services/monolith
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:   { condition: service_healthy }
      redis:      { condition: service_healthy }
      kafka:      { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL:       postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/fleetdb
      REDIS_URL:          redis://:${REDIS_PASSWORD:-redis_dev_password}@redis:6379/0
      KAFKA_BROKERS:      kafka:9092
      JWT_PRIVATE_KEY:    ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY:     ${JWT_PUBLIC_KEY:-}
      ROOT_DOMAIN:        ${ROOT_DOMAIN:-localhost}
      ENVIRONMENT:        ${ENVIRONMENT:-development}
      DEBUG:              ${DEBUG:-false}
      CORS_ORIGINS:       '["http://localhost:3000","http://localhost:3001","http://localhost:3002"]'

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [fleet-internal]
    ports: ["8000:8000"]

  # ── Telemetry Microservice (Go) ──────────────────────────────────────────
  telemetry:
    build:
      context: ../../services/telemetry
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      kafka:      { condition: service_healthy }
      redis:      { condition: service_healthy }
      postgres:   { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      PORT:           8080
      KAFKA_BROKERS:  kafka:9092
      KAFKA_TOPIC:    telemetry.raw
      KAFKA_DLQ:      telemetry.dead
      KAFKA_GROUP_ID: telemetry-consumer-v1
      REDIS_ADDR:     redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      DATABASE_URL:   postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/fleetdb
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    healthcheck:
      test: ["CMD", "/telemetry-service", "-health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [fleet-internal]
    ports: ["8080:8080"]

  # ── Nginx API Gateway ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    depends_on:
      monolith:  { condition: service_healthy }
      telemetry: { condition: service_healthy }
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks: [fleet-internal]
    ports: ["8082:80"]

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [fleet-internal, fleet-monitoring]
    ports: ["9090:9090"]

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:     'false'
      GF_INSTALL_PLUGINS:         grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks: [fleet-internal, fleet-monitoring]
    ports: ["3001:3000"]

  # ── Grafana Loki (Logs Aggregator) ──────────────────────────────────────────
  loki:
    image: grafana/loki:2.9.2
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [fleet-internal, fleet-monitoring]
    ports: ["3100:3100"]

  # ── Grafana Promtail (Logs Collector) ───────────────────────────────────────
  promtail:
    image: grafana/promtail:2.9.2
    restart: unless-stopped
    depends_on:
      loki: { condition: service_healthy }
    volumes:
      - ../monitoring/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks: [fleet-internal]

