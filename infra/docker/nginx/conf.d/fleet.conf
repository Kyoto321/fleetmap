server {
    listen 80;
    server_name _;  # Catch-all: wildcard *.localhost in dev, *.app.com in prod

    # Extract subdomain from Host header
    set $subdomain "";
    if ($host ~* "^([^.]+)\.") {
        set $subdomain $1;
    }

    # Centralized tenant resolution: prefer client's X-Subdomain header if present
    set $tenant_subdomain $subdomain;
    if ($http_x_subdomain ~* ".+") {
        set $tenant_subdomain $http_x_subdomain;
    }

    # ── Telemetry Microservice — isolated fast path ─────────────────────────
    location /api/v1/telemetry {
        limit_req zone=telemetry_zone burst=200 nodelay;

        proxy_pass         http://telemetry_pool;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";            # Enable keepalive
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Subdomain       $tenant_subdomain;
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;

        # Telemetry responses are tiny (202 Accepted) — no buffering needed
        proxy_buffering off;
    }

    # ── WebSocket Hub — special upgrade headers ────────────────────────────
    location /ws {
        proxy_pass              http://monolith_pool;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade    $http_upgrade;
        proxy_set_header        Connection "upgrade";
        proxy_set_header        Host       $http_host;
        proxy_set_header        X-Real-IP  $remote_addr;
        proxy_set_header        X-Subdomain $tenant_subdomain;
        proxy_read_timeout      86400s;   # 24h — WebSocket connections are long-lived
        proxy_send_timeout      86400s;
    }

    # ── Auth endpoint — strict rate limit ─────────────────────────────────
    location /api/v1/auth {
        limit_req zone=auth_zone burst=5 nodelay;

        proxy_pass         http://monolith_pool;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host        $http_host;
        proxy_set_header   X-Subdomain $tenant_subdomain;
        proxy_set_header   X-Real-IP   $remote_addr;
    }

    # ── Core Monolith — all other API routes ──────────────────────────────
    location /api/ {
        limit_req zone=api_zone burst=30 nodelay;

        proxy_pass         http://monolith_pool;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Subdomain       $tenant_subdomain;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Health check — no rate limiting ────────────────────────────────────
    location /health {
        proxy_pass http://monolith_pool;
        access_log off;
    }

    # ── Default — 404 for unknown routes ───────────────────────────────────
    location / {
        return 404 '{"error":"not_found"}';
        add_header Content-Type application/json;
    }
}
