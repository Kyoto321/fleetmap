worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured JSON access log
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"duration":$request_time,'
            '"upstream":"$upstream_addr",'
            '"ua":"$http_user_agent"'
        '}';

    access_log  /var/log/nginx/access.log json_combined;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_zone:10m       rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_zone:1m       rate=5r/m;
    limit_req_zone $binary_remote_addr zone=telemetry_zone:10m rate=200r/s;

    # Upstream pools
    upstream monolith_pool {
        server monolith:8000;
        keepalive 64;
    }

    upstream telemetry_pool {
        server telemetry:8080;
        keepalive 256;  # Higher — IoT devices send frequent short requests
    }

    include /etc/nginx/conf.d/*.conf;
}
